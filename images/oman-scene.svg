<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oskyy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="45%" stop-color="#e8935a"/>
      <stop offset="100%" stop-color="#a4522a"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c98a"/>
      <stop offset="100%" stop-color="#c1683b"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a24c"/>
      <stop offset="100%" stop-color="#7a4a1f"/>
    </linearGradient>
    <radialGradient id="osun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#ffbf6b"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#oskyy)"/>
  <circle cx="420" cy="230" r="110" fill="url(#osun)" opacity="0.95"/>

  <!-- far dune ridge -->
  <path d="M0,480 Q200,400 450,460 Q750,530 1000,440 Q1300,360 1600,470 V900 H0 Z" fill="url(#dune2)" opacity="0.85"/>

  <!-- mid dune -->
  <path d="M0,600 Q300,510 650,590 Q950,660 1250,560 Q1450,500 1600,570 V900 H0 Z" fill="url(#dune1)"/>

  <!-- near dune -->
  <path d="M0,720 Q350,640 700,710 Q1000,770 1300,690 Q1450,650 1600,700 V900 H0 Z" fill="#f2dcae"/>

  <!-- wind ripple lines -->
  <g stroke="#a4522a" stroke-width="3" fill="none" opacity="0.3">
    <path d="M100,760 q60,-20 120,0 q60,20 120,0"/>
    <path d="M900,740 q60,-20 120,0 q60,20 120,0"/>
    <path d="M1250,770 q60,-20 120,0 q60,20 120,0"/>
  </g>

  <!-- fort / minaret silhouette -->
  <g transform="translate(1180,560)" fill="#5c3417" opacity="0.9">
    <rect x="-14" y="-140" width="28" height="140" rx="4"/>
    <path d="M-14,-140 Q0,-175 14,-140 Z"/>
    <rect x="-40" y="-40" width="80" height="40"/>
    <rect x="-55" y="0" width="110" height="20"/>
    <circle cx="0" cy="-160" r="6"/>
  </g>

  <!-- camel caravan silhouette -->
  <g transform="translate(280,780)" fill="#2c2a26" opacity="0.85">
    <path d="M0,60 C-4,30 4,10 20,4 C18,-14 30,-28 44,-22 C50,-34 66,-34 72,-20 C86,-24 98,-12 94,4 C110,8 118,26 108,42 C112,50 108,60 98,60 C96,66 88,68 84,62 C78,68 68,68 64,60 L40,60 C36,68 26,68 22,60 C10,66 2,64 0,60 Z"/>
    <rect x="6" y="58" width="6" height="18"/>
    <rect x="26" y="58" width="6" height="18"/>
    <rect x="70" y="58" width="6" height="18"/>
    <rect x="90" y="58" width="6" height="18"/>
  </g>
  <g transform="translate(390,800) scale(0.75)" fill="#2c2a26" opacity="0.75">
    <path d="M0,60 C-4,30 4,10 20,4 C18,-14 30,-28 44,-22 C50,-34 66,-34 72,-20 C86,-24 98,-12 94,4 C110,8 118,26 108,42 C112,50 108,60 98,60 C96,66 88,68 84,62 C78,68 68,68 64,60 L40,60 C36,68 26,68 22,60 C10,66 2,64 0,60 Z"/>
    <rect x="6" y="58" width="6" height="18"/>
    <rect x="26" y="58" width="6" height="18"/>
    <rect x="70" y="58" width="6" height="18"/>
    <rect x="90" y="58" width="6" height="18"/>
  </g>

  <!-- stars for dusk feel -->
  <g fill="#fff3d6" opacity="0.7">
    <circle cx="150" cy="90" r="3"/>
    <circle cx="700" cy="60" r="2.5"/>
    <circle cx="1000" cy="110" r="2"/>
    <circle cx="1300" cy="80" r="3"/>
  </g>
</svg>

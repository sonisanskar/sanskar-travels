<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdca8"/>
      <stop offset="45%" stop-color="#e8935a"/>
      <stop offset="100%" stop-color="#5c4a8a"/>
    </linearGradient>
    <linearGradient id="gpeak1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4eef0"/>
      <stop offset="100%" stop-color="#8f7a9a"/>
    </linearGradient>
    <linearGradient id="gpeak2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a7a"/>
      <stop offset="100%" stop-color="#3a3050"/>
    </linearGradient>
    <radialGradient id="gsun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#ffc978"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#gsky)"/>
  <circle cx="1250" cy="220" r="100" fill="url(#gsun)" opacity="0.9"/>

  <!-- far snow peaks -->
  <path d="M0,420 L180,220 L340,420 Z" fill="url(#gpeak1)" opacity="0.9"/>
  <path d="M250,420 L470,160 L680,420 Z" fill="url(#gpeak1)" opacity="0.95"/>
  <path d="M600,420 L800,250 L980,420 Z" fill="url(#gpeak1)" opacity="0.85"/>
  <path d="M170,270 L180,220 L195,270 Z" fill="#fff" opacity="0.9"/>
  <path d="M440,210 L470,160 L500,210 Z" fill="#fff" opacity="0.9"/>
  <path d="M770,290 L800,250 L830,290 Z" fill="#fff" opacity="0.9"/>

  <!-- mid mountains -->
  <path d="M900,460 Q1050,320 1200,440 Q1350,300 1600,450 V900 H900 Z" fill="url(#gpeak2)" opacity="0.9"/>
  <path d="M0,470 Q200,380 400,460 Q650,360 900,470 V900 H0 Z" fill="url(#gpeak2)"/>

  <!-- pine tree ridge -->
  <g fill="#1f6b53" opacity="0.85">
    <path d="M120,620 L150,540 L180,620 Z"/>
    <path d="M160,630 L195,530 L230,630 Z"/>
    <path d="M210,625 L240,545 L270,625 Z"/>
    <path d="M1330,630 L1365,540 L1400,630 Z"/>
    <path d="M1380,625 L1410,550 L1440,625 Z"/>
  </g>

  <!-- hilltop with church silhouette (Gergeti Trinity style) -->
  <g transform="translate(800,560)">
    <path d="M-260,120 Q-100,20 0,60 Q120,10 260,120 Z" fill="#3a3050" opacity="0.8"/>
    <g transform="translate(0,-10)" fill="#2c2a26">
      <rect x="-38" y="-10" width="76" height="60"/>
      <path d="M-45,-10 L0,-55 L45,-10 Z"/>
      <rect x="-8" y="-85" width="16" height="35"/>
      <path d="M-14,-85 Q0,-100 14,-85 Z"/>
      <circle cx="0" cy="-95" r="5"/>
      <rect x="-50" y="45" width="20" height="15"/>
      <rect x="30" y="45" width="20" height="15"/>
    </g>
  </g>

  <!-- lower slopes -->
  <path d="M0,700 Q400,630 800,690 Q1150,740 1600,660 V900 H0 Z" fill="#1f6b53" opacity="0.5"/>
  <path d="M0,760 Q400,710 800,750 Q1150,790 1600,730 V900 H0 Z" fill="#164f3e" opacity="0.6"/>

  <!-- paraglider silhouette -->
  <g transform="translate(360,300)" fill="#2c2a26" opacity="0.75">
    <path d="M-70,0 Q0,-35 70,0 L40,10 Q0,-5 -40,10 Z"/>
    <line x1="-40" y1="10" x2="-5" y2="55" stroke="#2c2a26" stroke-width="3"/>
    <line x1="40" y1="10" x2="5" y2="55" stroke="#2c2a26" stroke-width="3"/>
    <circle cx="0" cy="60" r="6"/>
  </g>

  <!-- birds -->
  <g stroke="#3a3050" stroke-width="4" fill="none" opacity="0.5">
    <path d="M1050,160 q15,-15 30,0 q15,-15 30,0"/>
    <path d="M1130,200 q12,-12 24,0 q12,-12 24,0"/>
  </g>
</svg>

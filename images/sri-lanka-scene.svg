<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdca8"/>
      <stop offset="45%" stop-color="#f5a45f"/>
      <stop offset="100%" stop-color="#c1683b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f8f7c"/>
      <stop offset="100%" stop-color="#0b4a41"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#ffcf7d"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="260" r="120" fill="url(#sun)" opacity="0.9"/>

  <!-- distant hills -->
  <path d="M0,520 Q250,440 500,510 T1000,500 T1600,520 V900 H0 Z" fill="#2f6f6a" opacity="0.55"/>

  <!-- sea -->
  <path d="M0,560 Q400,530 800,560 T1600,560 V900 H0 Z" fill="url(#sea)"/>
  <path d="M0,600 Q400,575 800,600 T1600,600" stroke="#bfe9dd" stroke-width="4" fill="none" opacity="0.4"/>
  <path d="M0,650 Q400,625 800,650 T1600,650" stroke="#bfe9dd" stroke-width="4" fill="none" opacity="0.3"/>

  <!-- beach -->
  <path d="M0,700 Q400,660 800,695 T1600,690 V900 H0 Z" fill="#f2dcae"/>

  <!-- palm trees -->
  <g transform="translate(150,560)">
    <path d="M0,340 C-10,240 0,160 10,60" stroke="#5c4a3a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g fill="#1f6b53">
      <path d="M10,60 C-60,20 -110,40 -150,10 C-100,-10 -40,10 10,60 Z"/>
      <path d="M10,60 C70,10 130,20 170,-10 C120,-20 60,0 10,60 Z"/>
      <path d="M10,60 C-30,-30 -20,-90 -50,-140 C0,-110 20,-40 10,60 Z"/>
      <path d="M10,60 C50,-20 40,-90 70,-130 C110,-90 60,-30 10,60 Z"/>
      <path d="M10,60 C-10,-10 -70,-30 -100,-80 C-40,-70 0,-20 10,60 Z"/>
    </g>
  </g>

  <g transform="translate(1420,600) scale(0.8)">
    <path d="M0,340 C10,240 0,160 -10,60" stroke="#5c4a3a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g fill="#1f6b53">
      <path d="M-10,60 C50,20 100,40 140,10 C90,-10 30,10 -10,60 Z"/>
      <path d="M-10,60 C-70,10 -130,20 -170,-10 C-120,-20 -60,0 -10,60 Z"/>
      <path d="M-10,60 C30,-30 20,-90 50,-140 C0,-110 -20,-40 -10,60 Z"/>
      <path d="M-10,60 C-50,-20 -40,-90 -70,-130 C-110,-90 -60,-30 -10,60 Z"/>
    </g>
  </g>

  <!-- tuk-tuk silhouette -->
  <g transform="translate(720,745)" fill="#2c2a26" opacity="0.85">
    <path d="M0,40 h150 v-45 c0,-20 -15,-35 -35,-35 h-10 l-20,-25 h-55 l-15,25 h-5 c-20,0 -35,15 -35,35 Z"/>
    <circle cx="25" cy="45" r="16" fill="#1c1a17"/>
    <circle cx="130" cy="45" r="16" fill="#1c1a17"/>
    <rect x="95" y="-30" width="8" height="30" fill="#1c1a17"/>
  </g>

  <!-- birds -->
  <g stroke="#5c3a1f" stroke-width="4" fill="none" opacity="0.6">
    <path d="M300,180 q15,-15 30,0 q15,-15 30,0"/>
    <path d="M380,220 q12,-12 24,0 q12,-12 24,0"/>
    <path d="M900,150 q15,-15 30,0 q15,-15 30,0"/>
  </g>
</svg>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7a3"/>
      <stop offset="45%" stop-color="#f0925c"/>
      <stop offset="100%" stop-color="#b45a35"/>
    </linearGradient>
    <linearGradient id="tsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0aa1a0"/>
      <stop offset="100%" stop-color="#0a5457"/>
    </linearGradient>
    <radialGradient id="tsun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#ffc978"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#tsky)"/>
  <circle cx="1250" cy="230" r="110" fill="url(#tsun)" opacity="0.9"/>

  <!-- karst islands -->
  <path d="M150,470 C170,400 220,380 260,430 C290,390 330,410 330,460 C360,440 400,460 390,510 L130,510 Z" fill="#1f6b6a" opacity="0.75"/>
  <path d="M950,460 C980,390 1050,370 1090,430 C1120,400 1170,420 1160,480 L930,490 Z" fill="#1f6b6a" opacity="0.6"/>

  <!-- sea -->
  <path d="M0,560 Q400,530 800,560 T1600,560 V900 H0 Z" fill="url(#tsea)"/>
  <path d="M0,610 Q400,585 800,610 T1600,610" stroke="#bdeeeb" stroke-width="4" fill="none" opacity="0.35"/>
  <path d="M0,660 Q400,635 800,660 T1600,660" stroke="#bdeeeb" stroke-width="4" fill="none" opacity="0.25"/>

  <!-- beach -->
  <path d="M0,700 Q400,665 800,695 T1600,690 V900 H0 Z" fill="#f4dfae"/>

  <!-- palm trees -->
  <g transform="translate(180,570)">
    <path d="M0,330 C-8,230 0,150 8,50" stroke="#5c4a3a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g fill="#1f6b53">
      <path d="M8,50 C-55,15 -105,35 -140,5 C-95,-15 -35,5 8,50 Z"/>
      <path d="M8,50 C65,5 120,15 155,-15 C110,-25 55,-5 8,50 Z"/>
      <path d="M8,50 C-25,-35 -20,-95 -45,-145 C0,-115 15,-45 8,50 Z"/>
      <path d="M8,50 C45,-25 40,-95 65,-135 C105,-95 55,-35 8,50 Z"/>
    </g>
  </g>

  <!-- longtail boat -->
  <g transform="translate(760,690)" fill="#2c2a26" opacity="0.88">
    <path d="M0,30 C40,45 260,45 300,30 L290,50 C230,62 60,62 10,50 Z"/>
    <path d="M270,30 L340,-60" stroke="#2c2a26" stroke-width="8" stroke-linecap="round"/>
    <path d="M120,28 L140,-40" stroke="#2c2a26" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- temple stupa silhouette -->
  <g transform="translate(1350,600)" fill="#7a3f22" opacity="0.85">
    <path d="M-10,-150 L10,-150 L10,-170 L20,-170 L20,-150 L34,-150 L0,-200 Z"/>
    <rect x="-6" y="-150" width="12" height="60"/>
    <path d="M-40,-90 L40,-90 L55,-60 L-55,-60 Z"/>
    <rect x="-60" y="-60" width="120" height="60"/>
  </g>

  <!-- birds -->
  <g stroke="#7a3f22" stroke-width="4" fill="none" opacity="0.5">
    <path d="M300,160 q15,-15 30,0 q15,-15 30,0"/>
    <path d="M900,130 q12,-12 24,0 q12,-12 24,0"/>
  </g>
</svg>

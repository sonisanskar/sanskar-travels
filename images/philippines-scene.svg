<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe8f0"/>
      <stop offset="50%" stop-color="#ffe0b8"/>
      <stop offset="100%" stop-color="#f4a574"/>
    </linearGradient>
    <linearGradient id="plagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27c4c0"/>
      <stop offset="55%" stop-color="#0e8f98"/>
      <stop offset="100%" stop-color="#0a5a66"/>
    </linearGradient>
    <linearGradient id="pcliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d8a84"/>
      <stop offset="100%" stop-color="#4a5550"/>
    </linearGradient>
    <radialGradient id="psun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="100%" stop-color="#ffd98a"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#psky)"/>
  <circle cx="1280" cy="230" r="105" fill="url(#psun)" opacity="0.92"/>

  <!-- distant karst -->
  <g fill="#5d8f8a" opacity="0.45">
    <path d="M60,540 C90,430 140,400 175,455 C205,380 255,390 275,470 L290,540 Z"/>
    <path d="M1100,540 C1130,440 1190,420 1225,470 C1260,410 1320,425 1340,500 L1350,540 Z"/>
  </g>

  <!-- big limestone cliffs framing the lagoon -->
  <g>
    <path d="M0,200 C60,180 120,240 150,330 C190,400 215,480 230,600 L0,600 Z" fill="url(#pcliff)"/>
    <path d="M0,330 C40,310 100,350 130,430 C150,480 165,540 175,600 L0,600 Z" fill="#2f6b4f" opacity="0.65"/>
    <path d="M1600,150 C1530,170 1470,250 1440,340 C1405,420 1385,500 1375,600 L1600,600 Z" fill="url(#pcliff)"/>
    <path d="M1600,300 C1560,290 1500,340 1470,420 C1450,480 1440,540 1432,600 L1600,600 Z" fill="#2f6b4f" opacity="0.65"/>
  </g>

  <!-- mid karst islands -->
  <g>
    <path d="M520,560 C545,470 600,440 640,490 C672,430 725,445 740,520 L748,560 Z" fill="url(#pcliff)"/>
    <path d="M538,560 C555,500 595,485 625,520 L636,560 Z" fill="#2f6b4f" opacity="0.6"/>
    <path d="M900,560 C925,490 975,470 1010,515 C1040,470 1090,485 1100,545 L1104,560 Z" fill="url(#pcliff)"/>
  </g>

  <!-- lagoon -->
  <path d="M0,560 Q400,540 800,560 T1600,560 V900 H0 Z" fill="url(#plagoon)"/>
  <g stroke="#d9fbf5" stroke-width="3" fill="none" opacity="0.35">
    <path d="M0,620 Q300,605 600,620 T1200,620 T1600,615"/>
    <path d="M0,690 Q300,675 600,690 T1200,690 T1600,685"/>
    <path d="M0,770 Q300,755 600,770 T1200,770 T1600,765"/>
  </g>

  <!-- bangka (outrigger boat) -->
  <g transform="translate(640,690)" fill="#2c2a26" opacity="0.92">
    <path d="M0,40 C60,62 280,62 340,40 L325,62 C260,78 80,78 15,62 Z"/>
    <rect x="95" y="2" width="150" height="38" rx="4"/>
    <path d="M85,2 L170,-34 L255,2 Z"/>
    <!-- outriggers -->
    <path d="M-60,60 L30,50" stroke="#2c2a26" stroke-width="7" stroke-linecap="round"/>
    <path d="M-95,64 C-60,70 20,70 55,64" stroke="#2c2a26" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M370,60 L305,50" stroke="#2c2a26" stroke-width="7" stroke-linecap="round"/>
    <path d="M345,64 C380,70 440,70 470,64" stroke="#2c2a26" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- palm tree foreground -->
  <g transform="translate(1480,520)">
    <path d="M0,380 C10,260 -5,160 -20,70" stroke="#5c4a3a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g fill="#1f6b53">
      <path d="M-20,70 C-80,25 -135,45 -175,10 C-125,-12 -60,12 -20,70 Z"/>
      <path d="M-20,70 C40,25 100,35 140,0 C90,-18 30,5 -20,70 Z"/>
      <path d="M-20,70 C-55,-25 -45,-90 -75,-140 C-25,-110 -5,-40 -20,70 Z"/>
      <path d="M-20,70 C20,-20 10,-85 40,-125 C80,-90 30,-30 -20,70 Z"/>
    </g>
  </g>

  <!-- birds -->
  <g stroke="#3a5f66" stroke-width="4" fill="none" opacity="0.5">
    <path d="M340,170 q15,-15 30,0 q15,-15 30,0"/>
    <path d="M420,215 q12,-12 24,0 q12,-12 24,0"/>
    <path d="M1000,140 q15,-15 30,0 q15,-15 30,0"/>
  </g>
</svg>
